# Render Blueprint — Vite web app only (Expo/native is unchanged).
# Docs: https://render.com/docs/static-sites
services:
  - type: web
    name: blyve-web
    runtime: static
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - index.html
        - vite.config.ts
        - src/**
        - public/**
        - package.json
        - package-lock.json
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_CALL_PROVIDER
        value: jitsi
